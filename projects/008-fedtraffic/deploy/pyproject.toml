[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fedtraffic-deploy"
version = "1.0.0"
description = "Federated METR-LA forecasting as a real Flower deployment (SuperLink + one SuperNode per district)"
license = "MIT"
dependencies = ["flwr==1.42.0", "torch==2.15.0"]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "keshavmarkan"

[tool.flwr.app.components]
serverapp = "fedtraffic_app.apps:server"
clientapp = "fedtraffic_app.apps:client"

# Overrides applied on top of configs/default.yaml for this run (change with flwr run -c "rounds=5").
[tool.flwr.app.config]
rounds = 3
local-epochs = 1
strategy = "fedavg"
run-name = "deployment_fedavg"
